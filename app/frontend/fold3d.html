<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Anteprima piega 3D — FerroTrack</title>
<link rel="stylesheet" href="/ft-ui.css">
<script src="/ft-ui.js"></script>
<style>
  /* Anteprima piega 3D. Base grafica da ft-ui.css: qui il visore three.js,
     la barra e il pannello della piega. */
  html, body.ft { height: 100%; background: var(--ft-canvas); overflow: hidden; }
  #viewer { position: absolute; inset: 0; }
  #viewer canvas { display: block; }
  /* Modello pronto: entra con una breve dissolvenza */
  #viewer.pronto canvas { animation: foldEntra .5s var(--ft-ease) both; }
  @keyframes foldEntra { from { opacity: 0; transform: scale(.97); } to { opacity: 1; transform: none; } }
  .bar {
    position: absolute; left: 0; right: 0; top: 0; height: 56px; z-index: 10;
    background: rgba(255,255,255,.92); border-bottom: 1px solid var(--ft-line);
    backdrop-filter: blur(18px) saturate(180%); -webkit-backdrop-filter: blur(18px) saturate(180%);
    color: var(--ft-ink); display: flex; align-items: center; gap: 12px; padding: 0 16px 0 18px;
  }
  .bar .ft-logo { width: 30px; height: 30px; font-size: 13px; flex-shrink: 0; }
  .bar .title { font: 800 15px var(--ft-display); letter-spacing: -.3px; white-space: nowrap; }
  .bar .pill { max-width: 360px; overflow: hidden; text-overflow: ellipsis; font-family: var(--ft-mono); font-weight: 500; }
  .bar .sp { flex: 1; }
  .panel {
    position: absolute; top: 72px; right: 16px; z-index: 10; width: 250px;
    background: rgba(255,255,255,.94); color: var(--ft-ink); border: 1px solid var(--ft-line);
    border-radius: var(--ft-r-l); padding: 14px 16px;
    backdrop-filter: blur(10px); box-shadow: var(--ft-elev-2);
    animation: ftPop .25s var(--ft-ease);
  }
  .panel h4 { font-size: 11px; font-weight: 700; letter-spacing: .04em; color: var(--ft-ink-3); text-transform: uppercase; margin-bottom: 10px; }
  .panel .row { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 8px; }
  .panel .row label { font-size: 13px; font-weight: 600; color: var(--ft-ink-2); }
  .panel .val { font: 800 15px var(--ft-display); color: var(--ft-ink); font-variant-numeric: tabular-nums; }
  input[type=range] { -webkit-appearance: none; appearance: none; width: 100%; height: 4px; border-radius: 4px; background: linear-gradient(90deg, var(--ft-accent) var(--pct,0%), var(--ft-line) var(--pct,0%)); outline: none; cursor: pointer; }
  input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 17px; height: 17px; border-radius: 50%; background: var(--ft-panel); border: 2px solid var(--ft-accent); cursor: pointer; box-shadow: 0 1px 4px rgba(15,23,42,.18); transition: box-shadow .15s; }
  input[type=range]::-webkit-slider-thumb:hover { box-shadow: 0 0 0 4px var(--ft-accent-glow); }
  input[type=range]::-moz-range-thumb { width: 15px; height: 15px; border-radius: 50%; background: var(--ft-panel); border: 2px solid var(--ft-accent); cursor: pointer; }
  .btnrow { display: flex; margin-top: 12px; width: 100%; }
  .btnrow button { flex: 1; justify-content: center; }
  .bends { margin-top: 14px; border-top: 1px solid var(--ft-line); padding-top: 10px; }
  .bend { display: flex; align-items: center; gap: 10px; font-size: 12.5px; padding: 4px 0; color: var(--ft-ink-2); font-variant-numeric: tabular-nums; }
  .bend .dir { width: 52px; font-weight: 700; font-size: 11.5px; }
  .bend .su { color: var(--ft-accent-ink); } .bend .giu { color: var(--ft-ink); }
  .bend .r { color: var(--ft-ink-4); font-family: var(--ft-mono); font-size: 11.5px; }
  .bend.vuota { color: var(--ft-ink-3); }
  /* Caricamento: sagoma che luccica */
  #loading { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; flex-direction: column; gap: 14px; z-index: 20; color: var(--ft-ink-3); font-size: 13px; font-weight: 500; background: var(--ft-canvas); }
  .load-piega { position: relative; width: 150px; height: 96px; }
  .load-piega .ft-skel { position: absolute; border-radius: 8px; background-image: linear-gradient(90deg, #E2E5EA 25%, #EEF0F3 50%, #E2E5EA 75%); }
  /* sul fondo grigio la sagoma va un tono piu' scura */
  .load-piega .p1 { left: 0; bottom: 0; width: 150px; height: 22px; }
  .load-piega .p2 { left: 0; bottom: 18px; width: 22px; height: 70px; transform: skewY(-14deg); transform-origin: bottom; }
  .load-piega .p3 { right: 0; bottom: 18px; width: 22px; height: 52px; transform: skewY(14deg); transform-origin: bottom; }
  .err { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; padding:30px; text-align:center; z-index:25; }
  .err .ft-empty { animation: ftIn .22s var(--ft-ease); }
  .err .ft-empty-icon { background: var(--ft-err-bg); color: var(--ft-err); font: 800 18px var(--ft-display); }
  .hint { position: absolute; left: 16px; bottom: 14px; z-index: 10; font-size: 11.5px; color: var(--ft-ink-3);
          background: rgba(255,255,255,.88); border: 1px solid var(--ft-line); border-radius: 999px; padding: 5px 13px;
          backdrop-filter: blur(6px); box-shadow: var(--ft-elev-1); }
  /* Modalità miniatura: solo il 3D che ruota, nessuna UI, sfondo tenue */
  body.thumb .bar, body.thumb .panel, body.thumb .hint { display: none !important; }
  body.thumb, body.thumb html { background: #EEF2F6; }
  body.thumb #loading { background: #EEF2F6; }
  body.thumb #loading .load-txt { display: none; }
  body.thumb .load-piega { transform: scale(.5); }
  /* Incorporato (?embed=1, tablet dell'officina): la pagina ospite ha gia'
     titolo e "Chiudi" nella sua barra. Qui niente barra, e comandi grandi
     per le dita. */
  body.embed .bar { display: none !important; }
  body.embed .panel { top: 16px; width: 290px; }
  body.embed .panel .row label, body.embed .panel .val { font-size: 16px; }
  body.embed .btnrow button { min-height: 52px; font-size: 16px; }
  body.embed input[type=range] { height: 10px; }
  body.embed input[type=range]::-webkit-slider-thumb { width: 34px; height: 34px; }
  body.embed .hint { font-size: 15px; }
</style>
</head>
<body class="ft">
  <div class="bar">
    <span class="ft-logo" aria-hidden="true">LS</span>
    <div class="title">Anteprima piega 3D</div>
    <div class="pill ft-chip" id="part-name">—</div>
    <div class="sp"></div>
    <button class="ft-btn sm" onclick="closeMe()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>Chiudi</button>
  </div>

  <div id="viewer"></div>

  <div class="panel" id="panel" style="display:none;">
    <h4>Piega</h4>
    <div class="row"><label for="fold-slider">Apertura</label><span class="val" id="fold-val">100%</span></div>
    <input type="range" id="fold-slider" min="0" max="100" value="100">
    <div class="ft-seg btnrow">
      <button type="button" onclick="animateFold(0)">Disteso</button>
      <button type="button" onclick="animateFold(100)">Piegato</button>
    </div>
    <div class="bends" id="bends-list"></div>
  </div>

  <div id="loading" role="status" aria-live="polite">
    <div class="load-piega" aria-hidden="true"><span class="ft-skel p2"></span><span class="ft-skel p3"></span><span class="ft-skel p1"></span></div>
    <div class="load-txt">Costruzione 3D…</div>
  </div>
  <div class="hint">Trascina = ruota · Rotella = zoom</div>

<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
}}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const params = new URLSearchParams(location.search);
const isThumb = params.get('thumb') === '1';
if (isThumb) document.body.classList.add('thumb');
if (!isThumb && params.get('embed') === '1') {
  document.body.classList.add('embed');
  document.querySelector('.hint').textContent = 'Un dito = ruota · Due dita = zoom';
}
function closeMe(){ try{ window.parent && window.parent.postMessage({type:'fold3d-close'},'*'); }catch(_){} }
window.closeMe = closeMe;

function showErr(msg){
  document.getElementById('loading').style.display='none';
  const e=document.createElement('div'); e.className='err'; e.setAttribute('role','alert');
  e.innerHTML='<div class="ft-empty"><div class="ft-empty-icon">!</div><b>Anteprima non disponibile</b><p></p></div>';
  e.querySelector('p').textContent=msg; document.body.appendChild(e);
}
const esc = s => (window.FT ? FT.esc(s) : String(s == null ? '' : s).replace(/[&<>"']/g, c => '&#' + c.charCodeAt(0) + ';'));

// ── Ottieni il modello: da postMessage (iniettato dal CAD) o da ?src=<json> ──
let model = null;
function boot(m){ try{ build(m); }catch(e){ console.error(e); showErr('Errore 3D: '+e.message); } }
window.addEventListener('message', ev => { if(ev.data && ev.data.type==='fold3d-model'){ boot(ev.data.model); } });
const src = params.get('src');
if(src){ fetch(src).then(r=>r.json()).then(boot).catch(e=>showErr('Errore fetch modello: '+e.message)); }
if(window.parent) try{ window.parent.postMessage({type:'fold3d-ready'},'*'); }catch(_){}

// ───────────────────────── costruzione scena ─────────────────────────
let scene, camera, renderer, controls, group, faceObjs = [], hinges = [], rootId = 0, foldFrac = 1;
let inited = false;

// Init UNA VOLTA: renderer, camera, luci, controlli, loop. Riusato tra i pezzi.
function initViewer(){
  scene = new THREE.Scene();
  scene.background = new THREE.Color(isThumb ? '#EEF2F6' : '#F2F4F7');
  scene.add(new THREE.HemisphereLight(0xB0C4DE, 0x33404F, 1.15));
  const key = new THREE.DirectionalLight(0xffffff, 1.7); key.position.set(2,3,4); scene.add(key);
  const fill = new THREE.DirectionalLight(0x8899BB, 0.55); fill.position.set(-3,1,-2); scene.add(fill);
  const rim = new THREE.DirectionalLight(0xAABBCC, 0.4); rim.position.set(0,-2,-3); scene.add(rim);

  camera = new THREE.PerspectiveCamera(42, innerWidth/innerHeight, 0.5, 5000);
  renderer = new THREE.WebGLRenderer({ antialias:true });
  renderer.setSize(innerWidth, innerHeight);
  renderer.setPixelRatio(Math.min(devicePixelRatio,2));
  renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.1;
  document.getElementById('viewer').appendChild(renderer.domElement);

  controls = new OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true; controls.dampingFactor = 0.09;
  if (isThumb) {
    controls.enableZoom = false; controls.enablePan = false; controls.enableRotate = false;
    controls.autoRotate = true; controls.autoRotateSpeed = 2.4;
  } else {
    const slider = document.getElementById('fold-slider');
    slider.addEventListener('input', ()=>{ setFold(parseInt(slider.value,10)/100); document.getElementById('fold-val').textContent=slider.value+'%'; slider.style.setProperty('--pct', slider.value+'%'); });
  }
  animate();
  inited = true;
}

// Svuota il gruppo precedente (riuso dell'iframe per pezzi diversi)
function clearPart(){
  if(!group) return;
  group.traverse(o=>{ if(o.geometry) o.geometry.dispose(); if(o.material) o.material.dispose(); });
  scene.remove(group); group = null; faceObjs = [];
}

function build(m){
  if(!m || !m.success || !m.faces || !m.faces.length){ if(!isThumb) showErr('Modello piega non disponibile per questo pezzo.'); return; }
  if(!inited) initViewer();
  clearPart();
  const name = params.get('name'); if(name) document.getElementById('part-name').textContent = name;
  const thickness = m.thickness || 2;
  rootId = m.root;
  hinges = m.hinges || [];

  group = new THREE.Group();
  scene.add(group);

  let minx=1e9,miny=1e9,maxx=-1e9,maxy=-1e9;
  m.faces.forEach(f => f.polygon.forEach(([x,y])=>{ minx=Math.min(minx,x);miny=Math.min(miny,y);maxx=Math.max(maxx,x);maxy=Math.max(maxy,y); }));
  const cx=(minx+maxx)/2, cy=(miny+maxy)/2;

  m.faces.forEach((f) => {
    const shape = new THREE.Shape();
    f.polygon.forEach(([x,y],i)=>{ if(i===0) shape.moveTo(x,y); else shape.lineTo(x,y); });
    const geo = new THREE.ExtrudeGeometry(shape, { depth: thickness, bevelEnabled: false });
    geo.translate(0,0,-thickness/2);
    const mat = new THREE.MeshPhongMaterial({ color: f.id===rootId?0x5B6472:0x7C8598, specular:0x222222, shininess:30, side:THREE.DoubleSide, flatShading:false });
    const mesh = new THREE.Mesh(geo, mat);
    mesh.matrixAutoUpdate = false;
    group.add(mesh);
    faceObjs.push({ id: f.id, mesh });
  });

  buildHingeSigns(m);
  group.position.set(-cx, -cy, 0);
  group.rotation.x = -Math.PI/2;

  // pannello pieghe (solo modalità editor)
  if(!isThumb){
    const bl = document.getElementById('bends-list');
    bl.innerHTML = hinges.map(h=>`<div class="bend"><span class="dir ${esc(h.verso)}">${h.verso==='su'?'▲ SU':'▼ GIÙ'}</span><span>${esc(h.gradi)}°</span><span class="r">R${esc(h.raggio)}</span></div>`).join('') || '<div class="bend vuota">Nessuna piega leggibile</div>';
    document.getElementById('panel').style.display='block';
    const slider = document.getElementById('fold-slider'); slider.style.setProperty('--pct','100%');
  }
  document.getElementById('loading').style.display='none';
  document.getElementById('viewer').classList.add('pronto');   // breve entrata del modello

  setFold(0); applyTransforms(); fitView();
  if (isThumb) {
    setFold(0.9);
  } else {
    setFoldUI(0); animateFold(100);
  }
}

function fitView(){
  const box = new THREE.Box3().setFromObject(group);
  if(box.isEmpty()) return;
  const c = box.getCenter(new THREE.Vector3());
  const sz = box.getSize(new THREE.Vector3());
  const maxd = Math.max(sz.x, sz.y, sz.z) || 100;
  controls.target.copy(c);
  const d = maxd * 1.8;
  camera.position.set(c.x + d*0.55, c.y + d*0.8, c.z + d*0.95);
  camera.near = maxd*0.01; camera.far = maxd*60; camera.updateProjectionMatrix();
  controls.update();
}

// Determina il segno di rotazione per ogni cerniera (su=+z, giu=-z della falda)
function buildHingeSigns(m){
  // adiacenza per BFS: mappa faceId -> lista {other, hinge}
  window._adj = {};
  m.faces.forEach(f=> window._adj[f.id]=[]);
  hinges.forEach(h=>{
    window._adj[h.faceA].push({other:h.faceB, hinge:h, childIsB:true});
    window._adj[h.faceB].push({other:h.faceA, hinge:h, childIsB:false});
  });
  // segno: proviamo +angolo, guardiamo se la falda va nel verso giusto
  hinges.forEach(h=>{ h._sign = 1; });
}

function rotAboutLine(ax,ay,az, dx,dy,dz, ang){
  const dir = new THREE.Vector3(dx,dy,dz).normalize();
  const M = new THREE.Matrix4();
  const T1 = new THREE.Matrix4().makeTranslation(-ax,-ay,-az);
  const R = new THREE.Matrix4().makeRotationAxis(dir, ang);
  const T2 = new THREE.Matrix4().makeTranslation(ax,ay,az);
  return M.multiplyMatrices(T2, R).multiply(T1);
}

// Calcola la matrice mondo di ogni faccia via BFS dalla radice, piegando le cerniere
function computeMatrices(frac){
  const mats = {}; mats[rootId] = new THREE.Matrix4().identity();
  const visited = new Set([rootId]);
  const queue = [rootId];
  while(queue.length){
    const fid = queue.shift();
    const Mp = mats[fid];
    for(const e of (window._adj[fid]||[])){
      if(visited.has(e.other)) continue;
      visited.add(e.other);
      const h = e.hinge;
      // asse cerniera nella posizione CORRENTE del genitore
      const A = new THREE.Vector3(h.a[0], h.a[1], 0).applyMatrix4(Mp);
      const B = new THREE.Vector3(h.b[0], h.b[1], 0).applyMatrix4(Mp);
      const dir = new THREE.Vector3().subVectors(B,A);
      // il figlio è la faccia 'other'. verso su → falda sale (+), giu → scende (−).
      // il segno assoluto dipende dall'orientamento a→b: lo fissiamo con _sign.
      let ang = THREE.MathUtils.degToRad(h.gradi) * frac * h._sign;
      // la falda che si muove è 'other' (verso su/giu relativo al lato)
      const childIsB = (e.other === h.faceB);
      const signVerso = (h.verso === 'su' ? 1 : -1) * (childIsB ? 1 : -1);
      ang = THREE.MathUtils.degToRad(h.gradi) * frac * signVerso * h._sign;
      const R = rotAboutLine(A.x,A.y,A.z, dir.x,dir.y,dir.z, ang);
      mats[e.other] = new THREE.Matrix4().multiplyMatrices(R, Mp);
      queue.push(e.other);
    }
  }
  return mats;
}

function applyTransforms(){
  const mats = computeMatrices(foldFrac);
  faceObjs.forEach(fo=>{ const M = mats[fo.id] || new THREE.Matrix4(); fo.mesh.matrix.copy(M); });
}
function setFold(frac){ foldFrac = Math.max(0,Math.min(1,frac)); applyTransforms(); }
function setFoldUI(pct){ const s=document.getElementById('fold-slider'); s.value=pct; s.style.setProperty('--pct',pct+'%'); document.getElementById('fold-val').textContent=pct+'%'; setFold(pct/100); }

let animReq=null;
function animateFold(targetPct){
  const s=document.getElementById('fold-slider');
  let cur=parseInt(s.value,10); const target=targetPct;
  if(animReq) cancelAnimationFrame(animReq);
  function step(){
    cur += (target-cur)*0.12;
    if(Math.abs(target-cur)<0.5) cur=target;
    setFoldUI(Math.round(cur));
    if(cur!==target) animReq=requestAnimationFrame(step);
  }
  step();
}
window.animateFold = animateFold;

function animate(){ requestAnimationFrame(animate); if(controls)controls.update(); if(renderer)renderer.render(scene,camera); }
addEventListener('resize', ()=>{ if(!renderer)return; camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth,innerHeight); });
</script>
</body>
</html>
