<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#F1F2F5">
<link rel="manifest" href="/manifest-cartellone.json">
<title>FerroTrack — Schermo officina</title>
<script src="/ft-accesso.js" data-pubblica></script>
<link rel="stylesheet" href="/ft-ui.css">
<script src="/ft-ui.js"></script>
<script src="/ft-tablet.js" defer></script>
<!--
  Schermo appeso in officina (TV 1920x1080, si legge da lontano): solo numeri
  anonimi da /api/dashboard-live, nessun nome ne' prezzo. Stessi token di
  ft-ui.css. Le classi "dl-" sono proprie di questa pagina.

  16/10/2026, regole "meno AI" (reports/Design FerroTrack meno AI.md):
  al posto di due riquadri di numeri, una barra e un pannello col marchio,
  una frase sola ("18 ordini in produzione, 3 pronti da spedire") e UNA
  barra divisa in tre (arrivati, in lavorazione, pronti) con i numeri sotto.
  Il verde solo per "pronti", che e' il fatto; niente puntini che pulsano,
  aloni, entrate, pillole. Se i dati sono vecchi lo dice in rosso, a parole.
-->
<style>
html, body.ft { height: 100%; width: 100%; overflow: hidden; }
body.ft { font-size: 16px; }
.dl { height: 100vh; display: grid; grid-template-rows: auto 1fr auto; padding: 4vh 4vw 3vh; }

/* testata */
.dl-head { display: flex; align-items: center; justify-content: space-between; gap: 32px; }
.dl-brand { display: flex; align-items: center; gap: 16px; }
.dl-brand .ft-logo { width: 56px; height: 56px; border-radius: var(--ft-r-l); font-size: 22px; }
.dl-brand-name { font: 600 32px/1 var(--ft-font); color: var(--ft-ink); }
.dl-brand-sub { margin-top: 6px; font-size: 18px; color: var(--ft-ink-3); }
.dl-clock { text-align: right; }
.dl-ora { font: 600 56px/1 var(--ft-font); color: var(--ft-ink); }
.dl-data { margin-top: 8px; font-size: 20px; color: var(--ft-ink-3); }

/* la frase e la barra */
.dl-main { align-self: center; display: grid; gap: 6vh; }
.dl-frase { font: 600 clamp(36px, 5.2vw, 96px)/1.12 var(--ft-font); color: var(--ft-ink); max-width: 26ch; }
.dl-frase .pronti { color: var(--ft-ok); white-space: nowrap; }
.dl-stato { display: grid; gap: 2.4vh; }
.dl-stato h2 { font: 600 clamp(20px, 1.6vw, 30px) var(--ft-font); color: var(--ft-ink-3); }
.dl-barra { display: flex; height: clamp(40px, 6vh, 72px); gap: 4px; }
.dl-barra > div { min-width: 8px; border-radius: var(--ft-r-s); transition: flex-grow .7s var(--ft-ease); }
.kanban-bar-fill.ricevuti { background: var(--ft-g7); }
.kanban-bar-fill.lavorazione { background: var(--ft-ink-3); }
.kanban-bar-fill.pronti { background: var(--ft-ok-dot); }
.dl-leg { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 24px; }
.dl-leg div { border-top: 1px solid var(--ft-line-3); padding-top: 1.6vh; }
.dl-bar-n { display: block; font: 600 clamp(40px, 4.4vw, 84px)/1 var(--ft-font); color: var(--ft-ink); }
.dl-bar-lbl { display: block; margin-top: 8px; font-size: clamp(18px, 1.5vw, 28px); color: var(--ft-ink-2); }
.dl-leg .ok .dl-bar-n, .dl-leg .ok .dl-bar-lbl { color: var(--ft-ok); }

/* piede: chi siamo, quieto */
.dl-foot { display: flex; align-items: baseline; justify-content: space-between; gap: 24px; padding-top: 2vh; border-top: 1px solid var(--ft-line);
  font-size: clamp(16px, 1.1vw, 20px); color: var(--ft-ink-3); }
.dl-foot b { color: var(--ft-ink-2); font-weight: 600; }
#live.off { color: var(--ft-err); font-weight: 600; }
.dl-foot-dx { display: flex; align-items: center; gap: 16px; }
#last-update { color: inherit; }

@media (max-width: 1100px) {
  html, body.ft { overflow: auto; }
  .dl { height: auto; min-height: 100vh; gap: 32px; padding: 24px 24px 16px; }
  .dl-ora { font-size: 40px; }
  .dl-brand-name { font-size: 24px; }
  .dl-foot { flex-direction: column; gap: 8px; }
}
@media (max-width: 720px) {
  .dl-leg { grid-template-columns: 1fr; }
}
</style>
</head>
<body class="ft">

<div class="dl">
  <header class="dl-head">
    <div class="dl-brand">
      <div class="ft-logo">LS</div>
      <div>
        <div class="dl-brand-name">FerroTrack</div>
        <div class="dl-brand-sub">Carpenteria metallica di precisione</div>
      </div>
    </div>
    <div class="dl-clock">
      <div class="dl-ora" id="clock-time">--:--</div>
      <div class="dl-data" id="clock-date">—</div>
    </div>
  </header>

  <main class="dl-main" id="dl-main">
    <!-- "Attivi ora" e "Attivita' giornata" contavano le scansioni con la
         pistola: pistole tolte, tolti anche loro (sarebbero stati zeri). -->
    <p class="dl-frase" id="frase"><span id="stat-produzione">—</span> ordini in produzione, <span class="pronti"><span id="stat-pronti">—</span> pronti da spedire</span>.</p>

    <section class="dl-stato" aria-label="Stato dell'officina">
      <h2>A che punto sono</h2>
      <div class="dl-barra" aria-hidden="true">
        <div class="kanban-bar-fill ricevuti" id="bar-ricevuti" style="flex-grow:1"></div>
        <div class="kanban-bar-fill lavorazione" id="bar-lavorazione" style="flex-grow:1"></div>
        <div class="kanban-bar-fill pronti" id="bar-pronti" style="flex-grow:1"></div>
      </div>
      <div class="dl-leg">
        <div><span class="dl-bar-n" id="n-ricevuti">—</span><span class="dl-bar-lbl">appena arrivati</span></div>
        <div><span class="dl-bar-n" id="n-lavorazione">—</span><span class="dl-bar-lbl">in lavorazione</span></div>
        <div class="ok"><span class="dl-bar-n" id="n-pronti">—</span><span class="dl-bar-lbl">pronti da spedire</span></div>
      </div>
    </section>
  </main>

  <footer class="dl-foot">
    <div><b id="brand-anni">35 anni</b> di esperienza. UNI EN 1090, ISO 9001, EN ISO 3834.</div>
    <div class="dl-foot-dx"><span id="live">aggiornato alle <span id="last-update">—</span></span><span data-schermo-intero></span></div>
  </footer>
</div>

<script>
// Orologio: ogni secondo
function updateClock() {
  const now = new Date();
  document.getElementById('clock-time').textContent = now.toLocaleTimeString('it-IT', { hour: '2-digit', minute: '2-digit' });
  const d = now.toLocaleDateString('it-IT', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
  document.getElementById('clock-date').textContent = d.charAt(0).toUpperCase() + d.slice(1);
}
setInterval(updateClock, 1000);
updateClock();

// Dati: ogni 10 s. Il numero che cambia si illumina un attimo (risposta a un fatto).
const ULTIMI = {};
function numero(id, valore) {
  const v = Number(valore) || 0;
  const el = document.getElementById(id);
  const prima = ULTIMI[id];
  ULTIMI[id] = v;
  el.textContent = v.toLocaleString('it-IT');
  if (prima !== undefined && prima !== v) FT.evidenzia(el);
}

let ULTIMO_OK = null;
async function refreshData() {
  const live = document.getElementById('live');
  try {
    const r = await fetch('/api/dashboard-live');
    const d = await r.json();
    if (!d.success) throw new Error(d.error || 'Errore server');

    numero('stat-produzione', d.snapshot.ordini_in_produzione);
    numero('stat-pronti', d.snapshot.ordini_pronti);
    // La barra divisa in tre: ogni parte lunga quanto i suoi ordini
    const k = d.kanban;
    document.getElementById('bar-ricevuti').style.flexGrow = Math.max(k.ricevuti, 0.05);
    document.getElementById('bar-lavorazione').style.flexGrow = Math.max(k.lavorazione, 0.05);
    document.getElementById('bar-pronti').style.flexGrow = Math.max(k.pronti, 0.05);
    numero('n-ricevuti', k.ricevuti);
    numero('n-lavorazione', k.lavorazione);
    numero('n-pronti', k.pronti);

    ULTIMO_OK = new Date();
    live.classList.remove('off');
    live.innerHTML = 'aggiornato alle <span id="last-update"></span>';
    document.getElementById('last-update').textContent = ULTIMO_OK.toLocaleTimeString('it-IT');
  } catch (e) {
    // I numeri restano gli ultimi buoni; la scritta rossa dice che sono vecchi.
    live.classList.add('off');
    live.innerHTML = ULTIMO_OK
      ? `Dati fermi alle <span id="last-update">${ULTIMO_OK.toLocaleTimeString('it-IT', { hour: '2-digit', minute: '2-digit' })}</span>: il server non risponde.`
      : 'Il server non risponde: <span id="last-update">nessun dato</span>.';
    console.error('refresh failed:', e);
  }
}

refreshData();
setInterval(refreshData, 10000);  // ogni 10 secondi

// Anni di esperienza: si cambiano dall'indirizzo, ?anni=42
const anni = new URLSearchParams(window.location.search).get('anni');
if (anni && /^\d+$/.test(anni)) document.getElementById('brand-anni').textContent = anni + ' anni';
</script>
</body>
</html>
