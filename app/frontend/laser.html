<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#FFFFFF">
<link rel="manifest" href="/manifest.json">
<link rel="apple-touch-icon" href="/icon-192.png">
<title>Laser · FerroTrack</title>
<link rel="stylesheet" href="/ft-ui.css">
<link rel="stylesheet" href="/laser.css?v=13">
<link rel="stylesheet" href="/procura.css?v=4">
<script src="/ft-accesso.js" data-stazioni="laser"></script>
<script src="/ft-ui.js"></script>
<!--
  Pagina del laser (09/10/2026). Una pagina sola, niente salti:
  a sinistra gli ordini, a destra l'ordine aperto, sopra (a tutto schermo)
  il controllo dei disegni. La logica dello stato degli ordini sta sul server
  (backend/api_laser.py); qui solo la vista. Moduli:
    laser-base.js        stato unico, chiamate al server, formati, tasti
    laser-lista.js       elenco degli ordini e azioni su piu' ordini
    laser-ordine.js      ordine aperto: prossimo passo, pezzi, disegni, PDF
    laser-abbina.js      righe degli ordini solo PDF da abbinare a Lantek
    laser-controllo.js   controllo dei disegni a tutto schermo
    laser-lantek.js      "Manda a Lantek" (uno o piu' ordini)
    laser-pacchi.js      il pacco di taglio: Proposto, Confermato, In Lantek, Tagliato
    laser-saturazione.js la riga "Laser, prossimi 5 giorni lavorativi" (carico-laser.js)
    laser-procura.js     "Da procurare": tubi, laser tubo, meccanica, commerciali
    laser-quadratura.js  la quadratura dell'ordine (ft-quadratura.js): la riga, la parola
                         nell'elenco, la spunta prima di mandare / tagliare
    laser-avvio.js       avvio, aggiornamento automatico, notifiche
    laser-segnala.js     i problemi segnalati dal tablet dell'officina: Visto, Risolto
-->
</head>
<body class="ft lz ftc" data-stazione="laser" data-cerca-testo="Cerca un ordine: numero o cliente">

<!-- Cornice uguale in ogni stazione (ft-cornice.js, ft-ui.css "Cornice unica") -->
<nav class="ftc-side" aria-label="Laser">
  <div class="ftc-menu" id="lz-menu">
    <button class="ft-tab active" type="button" data-lz-vai="tutti">Ordini al laser <span class="ft-count" id="lzm-tutti"></span></button>
    <button class="ft-tab sub" type="button" data-lz-vai="coda">Da mandare a Lantek <span class="ft-count" id="lzm-coda"></span></button>
    <button class="ft-tab sub" type="button" data-lz-vai="in_lantek">In Lantek, da tagliare <span class="ft-count" id="lzm-in_lantek"></span></button>
    <button class="ft-tab" type="button" data-lz-vai="lamiere" title="Le lamiere da tagliare, con gli ordini che le usano: per fare i pacchi">Per lamiera <span class="ft-count" id="lzm-lamiere"></span></button>
    <button class="ft-tab" type="button" data-lz-vai="controllo" title="Controlla i disegni degli ordini da mandare (C)">Controllo disegni <span class="ft-count" id="lzm-controllo"></span></button>
    <button class="ft-tab" type="button" data-lz-vai="correggere" title="Codici tenuti fuori perché diversi dall'ordine">Da correggere in Lantek <span class="ft-count" id="lzm-correggere"></span></button>
    <div class="ftc-gruppo">Altre pagine</div>
    <a class="ft-tab" href="/capo-officina.html">Capo officina</a>
  </div>
</nav>

<header class="ft-topbar">
  <div class="ft-topbar-end" style="margin-left:auto">
    <button class="lz-btn piccolo lz-procura-btn" id="lz-procura-btn" type="button" onclick="LZ.procura.apri()" title="Da procurare (D)"><i data-lucide="package"></i><span>Da procurare <span class="n"></span></span></button>
    <span class="ft-live" id="conn-badge" title="Si aggiorna da solo">In linea</span>
    <div class="lz-bell">
      <button class="ft-icon-btn" onclick="LZ.notifiche.apriChiudi(event)" title="Notifiche" aria-label="Notifiche">
        <i data-lucide="bell"></i><span class="ft-badge" id="notif-badge"></span>
      </button>
      <div class="ft-pop" id="notif-panel">
        <div class="ft-pop-head">
          <span>Notifiche</span>
          <button class="ft-link" id="notif-clear" onclick="LZ.notifiche.svuota()" style="display:none;">Cancella tutto</button>
        </div>
        <div id="notif-panel-body"><div class="ft-empty" style="padding:28px 16px;"><p>Nessuna notifica</p></div></div>
      </div>
    </div>
  </div>
</header>
<script src="/ft-cornice.js"></script>

<main class="lz-main">
  <aside class="lz-lista" id="lz-lista" aria-label="Ordini al laser"></aside>
  <section class="lz-dett" id="lz-dett" aria-live="polite"></section>
</main>
<div id="lz-sopra"></div>

<script src="/vendor/lucide.min.js"></script>
<script src="/ft-stati.js"></script>
<script src="/carico-laser.js?v=3"></script>
<script src="/laser-base.js?v=7"></script>
<script src="/ft-quadratura.js?v=1"></script>
<script src="/laser-quadratura.js?v=2"></script>
<script src="/laser-segnala.js?v=2"></script>
<script src="/laser-saturazione.js?v=4"></script>
<script src="/laser-lista.js?v=11"></script>
<script src="/laser-pacchi.js?v=3"></script>
<script src="/laser-ordine.js?v=14"></script>
<script src="/aggiungi-disegni.js?v=1"></script>
<script src="/laser-abbina.js?v=1"></script>
<script src="/laser-controllo.js?v=4"></script>
<script src="/laser-lantek.js?v=7"></script>
<script src="/laser-procura.js?v=3"></script>
<script src="/laser-avvio.js?v=8"></script>
</body>
</html>
