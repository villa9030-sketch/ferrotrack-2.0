<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<title>Anteprima 3D STEP - FerroTrack</title>
<script src="/ft-accesso.js" data-stazioni="*"></script>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%230B1220'/><text x='16' y='21.5' text-anchor='middle' font-size='14' font-family='Arial' fill='white' font-weight='800'>LS</text></svg>">
<link rel="stylesheet" href="/ft-ui.css">
<script src="/ft-ui.js"></script>
<style>
  /* Anteprima 3D STEP. Base grafica da ft-ui.css: qui il visore three.js,
     la testata (56px, la usa anche lo script) e la barra info (36px). */
  :root {
    --header-h: 56px;
    --info-h: 36px;
  }
  body.ft {
    background: var(--ft-canvas);
    overflow: hidden;
  }
  .header {
    background: rgba(255,255,255,.92); border-bottom: 1px solid var(--ft-line);
    backdrop-filter: blur(18px) saturate(180%); -webkit-backdrop-filter: blur(18px) saturate(180%);
    padding: 0 16px 0 18px; height: var(--header-h);
    display: flex; align-items: center; justify-content: space-between; gap: 16px;
    position: fixed; top: 0; left: 0; right: 0; z-index: 200;
  }
  .header-left { display: flex; align-items: center; gap: 12px; min-width: 0; }
  .header .ft-logo { width: 30px; height: 30px; font-size: 13px; flex-shrink: 0; }
  .header-title { font: 800 15px var(--ft-display); letter-spacing: -.3px; color: var(--ft-ink); white-space: nowrap; }
  .header-title small { font: 500 12.5px var(--ft-font); color: var(--ft-ink-3); margin-left: 4px; }
  .header-file { max-width: 420px; overflow: hidden; text-overflow: ellipsis; font-family: var(--ft-mono); font-weight: 500; }
  .header-file:empty { display: none; }
  #viewer {
    position: fixed; top: var(--header-h); left: 0; right: 0; bottom: var(--info-h);
  }
  #viewer canvas { display: block; }
  /* Modello pronto: entra con una breve dissolvenza */
  #viewer.pronto canvas { animation: stepEntra .5s var(--ft-ease) both; }
  @keyframes stepEntra { from { opacity: 0; transform: scale(.97); } to { opacity: 1; transform: none; } }

  /* Caricamento: sagoma che luccica + passo in corso */
  #loading {
    position: fixed; top: var(--header-h); left: 0; right: 0; bottom: var(--info-h);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    background: var(--ft-canvas); color: var(--ft-ink-3); z-index: 100; gap: 14px;
  }
  .load-cubo { position: relative; width: 132px; height: 132px; }
  .load-cubo .ft-skel { position: absolute; background-image: linear-gradient(90deg, #E2E5EA 25%, #EEF0F3 50%, #E2E5EA 75%); }
  /* sul fondo grigio la sagoma va un tono piu' scura */
  .load-cubo .f1 { left: 26px; top: 6px; width: 80px; height: 36px; border-radius: 10px; transform: skewX(-28deg); }
  .load-cubo .f2 { left: 8px; top: 46px; width: 72px; height: 78px; border-radius: 10px; }
  .load-cubo .f3 { left: 86px; top: 30px; width: 38px; height: 84px; border-radius: 10px; transform: skewY(-28deg); }
  .load-bar { width: 180px; height: 3px; border-radius: 3px; background: var(--ft-line); overflow: hidden; position: relative; }
  .load-bar::before { content: ''; position: absolute; top: 0; bottom: 0; width: 35%; border-radius: 3px; background: var(--ft-accent);
                      animation: stepScorri 1.1s ease-in-out infinite; }
  @keyframes stepScorri { from { left: -35%; } to { left: 100%; } }
  #loading-text { font-size: 13px; font-weight: 500; }
  /* Miniatura nella distinta: solo la sagoma, piccola */
  body.thumbnail-mode .load-cubo { transform: scale(.42); margin: -38px; }
  body.thumbnail-mode .load-bar, body.thumbnail-mode #loading-text { display: none; }
  #info-bar {
    position: fixed; bottom: 0; left: 0; right: 0; height: var(--info-h);
    background: var(--ft-panel); display: flex; align-items: center; padding: 0 16px;
    color: var(--ft-ink-3); font-size: 11.5px; gap: 12px; z-index: 200;
    border-top: 1px solid var(--ft-line);
  }
  #info-bar .badge:empty { display: none; }
  .info-sep { width: 1px; height: 14px; background: var(--ft-line); }
  #file-name { font-family: var(--ft-mono); color: var(--ft-ink-2); }
  #error-box {
    position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
    width: min(460px, calc(100vw - 32px)); white-space: pre-line;
    background: var(--ft-err-bg); color: #912018; border: 1px solid var(--ft-err-line);
    padding: 16px 20px 16px 48px; border-radius: var(--ft-r-l); box-shadow: var(--ft-elev-2);
    font-size: 13px; line-height: 1.5; display: none; z-index: 300; text-align: left;
    animation: ftPop .2s var(--ft-ease);
  }
  #error-box::before {
    content: '!'; position: absolute; left: 16px; top: 15px; width: 20px; height: 20px; border-radius: 50%;
    background: var(--ft-err); color: #fff; font: 800 12px/20px var(--ft-font); text-align: center;
  }
  #controls-panel {
    position: fixed; top: calc(var(--header-h) + 14px); right: 16px; z-index: 150;
    background: rgba(255,255,255,.94);
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    border: 1px solid var(--ft-line); box-shadow: var(--ft-elev-2);
    border-radius: var(--ft-r-l); padding: 14px 16px; min-width: 220px;
    display: none; flex-direction: column; gap: 10px;
    animation: ftPop .25s var(--ft-ease);
  }
  #controls-panel .panel-label {
    color: var(--ft-ink-3); font-size: 11px; font-weight: 700;
    letter-spacing: .04em; text-transform: uppercase;
  }
  .explode-row { display: flex; align-items: center; gap: 10px; }
  .explode-row span {
    color: var(--ft-ink); font: 700 12.5px var(--ft-display); font-variant-numeric: tabular-nums;
    min-width: 34px; text-align: right;
  }
  .explode-row .explode-lbl { color: var(--ft-ink-2); font: 600 12.5px var(--ft-font); min-width: auto; text-align: left; white-space: nowrap; }
  input[type="range"]#explode-slider {
    -webkit-appearance: none; appearance: none;
    flex: 1; height: 4px; border-radius: 2px;
    background: linear-gradient(to right,
      var(--ft-accent) 0%, var(--ft-accent) var(--pct, 0%),
      var(--ft-line) var(--pct, 0%), var(--ft-line) 100%);
    outline: none; cursor: pointer;
  }
  input[type="range"]#explode-slider::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 16px; height: 16px; border-radius: 50%;
    background: var(--ft-panel); border: 2px solid var(--ft-accent);
    box-shadow: 0 1px 4px rgba(15,23,42,.18);
    cursor: pointer; transition: box-shadow .15s;
  }
  input[type="range"]#explode-slider::-webkit-slider-thumb:hover { box-shadow: 0 0 0 4px var(--ft-accent-glow); }
  input[type="range"]#explode-slider::-moz-range-thumb {
    width: 14px; height: 14px; border-radius: 50%;
    background: var(--ft-panel); border: 2px solid var(--ft-accent); cursor: pointer;
  }
  #assemble-btn { margin-top: 4px; }
</style>
</head>
<body class="ft">

<div class="header">
  <div class="header-left">
    <span class="ft-logo" aria-hidden="true">LS</span>
    <span class="header-title">Anteprima 3D<small>STEP</small></span>
    <span class="ft-chip header-file" id="header-file-name"></span>
  </div>
  <button class="ft-btn sm" onclick="closeViewer()">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>Chiudi</button>
</div>

<div id="loading" role="status" aria-live="polite">
  <div class="load-cubo" aria-hidden="true"><span class="ft-skel f1"></span><span class="ft-skel f3"></span><span class="ft-skel f2"></span></div>
  <div class="load-bar" aria-hidden="true"></div>
  <div id="loading-text">Inizializzazione engine 3D...</div>
</div>
<div id="error-box" role="alert"></div>
<div id="viewer"></div>

<div id="controls-panel">
  <div class="panel-label">Vista</div>
  <div class="explode-row">
    <span class="explode-lbl">Esplodi</span>
    <input type="range" id="explode-slider" min="0" max="100" value="0" step="1">
    <span id="explode-val">0%</span>
  </div>
  <button id="assemble-btn" class="ft-btn accent block">Smonta ▸</button>
</div>

<div id="info-bar">
  <span id="bodies-badge" class="badge ft-chip accent"></span>
  <span id="weld-badge" class="badge ft-chip" style="display:none"></span>
  <span class="info-sep"></span>
  <span>Scroll = Zoom &nbsp;&middot;&nbsp; Drag = Ruota &nbsp;&middot;&nbsp; Click destro = Panoramica</span>
  <span style="flex:1"></span>
  <span id="file-name"></span>
</div>

<script>
  // Chiusura viewer: notifica parent via postMessage o chiudi window
  function closeViewer() {
    try { window.parent && window.parent.postMessage({ type: 'step-preview-close' }, '*'); } catch(_) {}
    if (window.parent && window.parent !== window) return;
    window.close();
  }
</script>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const loadingText = document.getElementById('loading-text');
const errorBox = document.getElementById('error-box');

function showError(msg) {
  errorBox.textContent = msg;
  errorBox.style.display = 'block';
  document.getElementById('loading').style.display = 'none';
}

// Legge parametri da query string: ?url=<step_url>&name=<display>&welds=<count>&thumbnail=1
const params = new URLSearchParams(window.location.search);
const stepUrl = params.get('url');
const displayName = params.get('name') || '';
const weldCount = params.get('welds');
const isThumbnail = params.get('thumbnail') === '1';
// Incorporato nella scheda assieme: la pagina ospite ha gia' titolo, nome del
// file e comandi nella sua barra. Qui resta solo il modello, sul fondo della
// cornice del disegno.
const isEmbed = !isThumbnail && params.get('embed') === '1';
if (isEmbed) {
  const style = document.createElement('style');
  style.textContent = `
    .header, #info-bar, #controls-panel { display: none !important; }
    body, #loading { background: #FAFBFC !important; }
    #viewer, #loading { top: 0 !important; bottom: 0 !important; }
    #loading { font-size: 13px; color: #667085; }
    .spinner { width: 28px; height: 28px; border-width: 2px; border-top-color: #667085; }
    #error-box { background: #FEF3F2; color: #B42318; border: 1px solid #FECDCA; font-size: 13px; }
  `;
  document.head.appendChild(style);
}

if (!stepUrl) {
  showError('Parametro URL mancante (query string: ?url=/path/to/file.step)');
  throw new Error('No STEP url');
}

// Thumbnail mode: nasconde header/info-bar/controls, viewer occupa full frame,
// nessuna interattività, background chiaro coerente col resto UI
if (isThumbnail) {
  document.body.classList.add('thumbnail-mode');
  const style = document.createElement('style');
  style.textContent = `
    body.thumbnail-mode { overflow: hidden !important; }
    body.thumbnail-mode .header, body.thumbnail-mode #info-bar, body.thumbnail-mode #controls-panel {
      display: none !important;
    }
    body.thumbnail-mode #viewer { top: 0 !important; bottom: 0 !important; }
    body.thumbnail-mode #loading { top: 0 !important; bottom: 0 !important; background: #FAFAFA !important; }
    body.thumbnail-mode { cursor: pointer !important; }
    body.thumbnail-mode #viewer canvas { pointer-events: none !important; }
  `;
  document.head.appendChild(style);
  // Notifica parent con click
  document.addEventListener('click', () => {
    try { window.parent && window.parent.postMessage({ type: 'step-thumbnail-click' }, '*'); } catch(_) {}
  });
}

// Mostra file name subito
if (displayName) {
  document.getElementById('file-name').textContent = displayName;
  document.getElementById('header-file-name').textContent = displayName;
}
if (weldCount && parseInt(weldCount, 10) > 0) {
  const wb = document.getElementById('weld-badge');
  wb.textContent = weldCount + ' saldature';
  wb.style.display = 'inline-flex';
}

// Fetch STEP file dal server
loadingText.textContent = 'Download file STEP...';
let stepBytes;
try {
  const resp = await fetch(stepUrl);
  if (!resp.ok) {
    showError('Errore download STEP (' + resp.status + ' ' + resp.statusText + ')');
    throw new Error('Fetch failed');
  }
  stepBytes = new Uint8Array(await resp.arrayBuffer());
} catch (e) {
  showError('Errore fetch STEP: ' + e.message);
  throw e;
}

loadingText.textContent = 'Caricamento engine OpenCASCADE (WASM)...';

// Load occt-import-js dynamically
const occtUrl = 'https://cdn.jsdelivr.net/npm/occt-import-js@0.0.12/dist/occt-import-js.js';
try {
  await new Promise((resolve, reject) => {
    const script = document.createElement('script');
    script.src = occtUrl;
    script.onload = resolve;
    script.onerror = reject;
    document.head.appendChild(script);
  });
} catch (e) {
  showError('Errore caricamento engine 3D. Verifica connessione internet.\n' + e.message);
  throw e;
}

loadingText.textContent = 'Parsing file STEP...';

let result;
try {
  const occt = await window.occtimportjs({
    locateFile: (name) => `https://cdn.jsdelivr.net/npm/occt-import-js@0.0.12/dist/${name}`
  });
  result = occt.ReadStepFile(stepBytes);
} catch (e) {
  showError('Errore parsing STEP: ' + e.message);
  throw e;
}

if (!result || !result.meshes || result.meshes.length === 0) {
  showError('Nessuna geometria trovata nel file STEP.');
  throw new Error('Empty result');
}

loadingText.textContent = 'Rendering 3D...';

// Three.js Scene Setup — sfondo coerente col resto UI (chiaro per thumbnail, grigio per modal)
const sceneBg = isThumbnail ? '#FAFAFA' : (isEmbed ? '#FAFBFC' : '#F2F4F7');
const scene = new THREE.Scene();
scene.background = new THREE.Color(sceneBg);
scene.fog = new THREE.FogExp2(sceneBg, 0.00008);

// Lighting — studio setup
const ambient = new THREE.HemisphereLight(0xB0C4DE, 0x2F4F4F, 1.2);
scene.add(ambient);
const keyLight = new THREE.DirectionalLight(0xffffff, 1.8);
keyLight.position.set(2, 3, 4);
scene.add(keyLight);
const fillLight = new THREE.DirectionalLight(0x8899BB, 0.6);
fillLight.position.set(-3, 1, -2);
scene.add(fillLight);
const rimLight = new THREE.DirectionalLight(0xAABBCC, 0.4);
rimLight.position.set(0, -2, -3);
scene.add(rimLight);

// Body colors — metallic dark palette
const bodyColors = [
  { color: 0x4A5568, specular: 0x333333 },
  { color: 0x57534E, specular: 0x2A2724 },
  { color: 0x525252, specular: 0x292929 },
  { color: 0x4B5563, specular: 0x262C35 },
  { color: 0x44403C, specular: 0x221F1C },
  { color: 0x3F3F46, specular: 0x1F1F23 },
];

const allGroup = new THREE.Group();
let bodyCount = 0;
const meshList = [];

for (let i = 0; i < result.meshes.length; i++) {
  const meshData = result.meshes[i];
  if (!meshData.attributes || !meshData.attributes.position) continue;
  const geometry = new THREE.BufferGeometry();
  geometry.setAttribute('position',
    new THREE.Float32BufferAttribute(meshData.attributes.position.array, 3));
  if (meshData.attributes.normal) {
    geometry.setAttribute('normal',
      new THREE.Float32BufferAttribute(meshData.attributes.normal.array, 3));
  } else {
    geometry.computeVertexNormals();
  }
  if (meshData.index) {
    geometry.setIndex(Array.from(meshData.index.array));
  }
  const palette = bodyColors[i % bodyColors.length];
  const material = new THREE.MeshPhongMaterial({
    color: palette.color,
    specular: palette.specular,
    shininess: 35,
    side: THREE.DoubleSide,
    flatShading: false,
  });
  const mesh = new THREE.Mesh(geometry, material);
  allGroup.add(mesh);
  bodyCount++;
  geometry.computeBoundingBox();
  const meshBox = geometry.boundingBox;
  const meshCentroid = new THREE.Vector3();
  meshBox.getCenter(meshCentroid);
  meshList.push({ mesh, centroid: meshCentroid, originalPos: new THREE.Vector3() });
}

scene.add(allGroup);

// Center geometry
const box = new THREE.Box3().setFromObject(allGroup);
const center = box.getCenter(new THREE.Vector3());
const size = box.getSize(new THREE.Vector3());
allGroup.position.sub(center);

const globalCentroid = new THREE.Vector3();
for (const item of meshList) {
  const worldCentroid = item.centroid.clone().sub(center);
  item.worldCentroid = worldCentroid;
  globalCentroid.add(worldCentroid);
}
if (meshList.length > 0) globalCentroid.divideScalar(meshList.length);

for (const item of meshList) {
  item.originalPos.copy(item.mesh.position);
}

const maxDim = Math.max(size.x, size.y, size.z);
const bboxDiag = size.length();
const explosionScale = bboxDiag * 0.5;

// Grid
const gridSize = maxDim * 3;
const grid = new THREE.GridHelper(gridSize, 40, 0xD0D5DD, 0xE4E7EC);
grid.position.y = -size.y / 2 - maxDim * 0.05;
grid.material.opacity = 0.3;
grid.material.transparent = true;
scene.add(grid);

// In thumbnail mode header e info-bar sono nascosti, il viewer occupa tutto
const headerH = (isThumbnail || isEmbed) ? 0 : 56;
const infoH = (isThumbnail || isEmbed) ? 0 : 36;
function viewportH() { return window.innerHeight - headerH - infoH; }
function viewportW() { return window.innerWidth; }

const camera = new THREE.PerspectiveCamera(40, viewportW() / viewportH(), maxDim * 0.001, maxDim * 20);
// Incorporato: distanza calcolata perche' il modello riempia il riquadro,
// qualunque sia la sua forma (stretto o largo)
function distanzaInquadra(aspect) {
  const v = THREE.MathUtils.degToRad(camera.fov);
  const h = 2 * Math.atan(Math.tan(v / 2) * aspect);
  return (bboxDiag / 2) / Math.sin(Math.min(v, h) / 2) * 0.92;
}
const dist = isEmbed ? distanzaInquadra(viewportW() / viewportH()) / Math.hypot(0.7, 0.4, 0.9) : maxDim * 2.0;
camera.position.set(dist * 0.7, dist * 0.4, dist * 0.9);
camera.lookAt(0, 0, 0);

const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false, powerPreference: 'high-performance' });
renderer.setSize(viewportW(), viewportH());
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.1;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.getElementById('viewer').appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.rotateSpeed = 0.8;
controls.zoomSpeed = 1.2;
controls.panSpeed = 0.8;
controls.minDistance = maxDim * 0.1;
controls.maxDistance = maxDim * 10;
// Thumbnail mode: nessuna interattività, camera fissa isometrica
if (isThumbnail) {
  controls.enabled = false;
  controls.enableZoom = false;
  controls.enablePan = false;
  controls.enableRotate = false;
}

document.getElementById('bodies-badge').textContent = bodyCount + ' corpi';
document.getElementById('controls-panel').style.display = 'flex';
document.getElementById('loading').style.display = 'none';
document.getElementById('viewer').classList.add('pronto');   // breve entrata del modello

// Notifica parent che il viewer è pronto
try { window.parent && window.parent.postMessage({ type: 'step-preview-ready', bodies: bodyCount }, '*'); } catch(_) {}

// Explode slider
const slider = document.getElementById('explode-slider');
const explodeVal = document.getElementById('explode-val');
function applyExplode(t) {
  if (meshList.length <= 1) return;
  for (const item of meshList) {
    const dir = item.worldCentroid.clone().sub(globalCentroid);
    if (dir.lengthSq() < 1e-10) {
      item.mesh.position.copy(item.originalPos);
      continue;
    }
    dir.normalize();
    const offset = dir.multiplyScalar(t * explosionScale);
    item.mesh.position.copy(item.originalPos).add(offset);
  }
}
function updateSliderFill(val) {
  slider.style.setProperty('--pct', val + '%');
}
function setExplodeUI(pct) {
  pct = Math.max(0, Math.min(100, Math.round(pct)));
  slider.value = pct;
  explodeVal.textContent = pct + '%';
  updateSliderFill(pct);
  applyExplode(pct / 100);
}
slider.addEventListener('input', () => {
  setExplodeUI(parseInt(slider.value, 10));
  _cancelExplodeAnim();  // se l'utente muove lo slider, ferma l'animazione
});
updateSliderFill(0);

// Animazione morbida dell'esploso (monta ⇄ smonta) — l'effetto "come si monta"
let _explodeAnim = null;
function _cancelExplodeAnim() { if (_explodeAnim) { cancelAnimationFrame(_explodeAnim); _explodeAnim = null; } }
function animateExplode(target, onDone) {
  _cancelExplodeAnim();
  const step = () => {
    let cur = parseInt(slider.value, 10);
    cur += (target - cur) * 0.14;
    if (Math.abs(target - cur) < 0.6) { cur = target; }
    setExplodeUI(cur);
    if (cur !== target) { _explodeAnim = requestAnimationFrame(step); }
    else { _explodeAnim = null; if (onDone) onDone(); }
  };
  step();
}

// Pulsante Monta/Smonta (solo modalità piena, non thumbnail)
const EXPLODE_TARGET = 55;
const assembleBtn = document.getElementById('assemble-btn');
if (assembleBtn && !isThumbnail) {
  assembleBtn.addEventListener('click', () => {
    const exploded = parseInt(slider.value, 10) > EXPLODE_TARGET / 2;
    animateExplode(exploded ? 0 : EXPLODE_TARGET);
    assembleBtn.textContent = exploded ? 'Smonta ▸' : '◂ Monta';
  });
} else if (assembleBtn) {
  assembleBtn.style.display = 'none';
}

// Comandi dalla pagina ospite (modalita' incorporata): esploso e vista iniziale
const camStart = camera.position.clone();
let _zoomAnim = null;
/** Porta la camera alla distanza d dal centro, stessa angolazione, con un
    breve scorrimento. */
function zoomA(d) {
  if (_zoomAnim) cancelAnimationFrame(_zoomAnim);
  const passo = () => {
    const off = camera.position.clone().sub(controls.target);
    const cur = off.length();
    const nuovo = cur + (d - cur) * 0.14;
    const fine = Math.abs(d - nuovo) < d * 0.002;
    camera.position.copy(controls.target).add(off.normalize().multiplyScalar(fine ? d : nuovo));
    controls.update();
    _zoomAnim = fine ? null : requestAnimationFrame(passo);
  };
  passo();
}
window.addEventListener('message', (ev) => {
  const m = ev.data || {};
  if (m.type !== 'step-cmd') return;
  if (m.cmd === 'esploso') {
    animateExplode(m.on ? EXPLODE_TARGET : 0);
    // l'esploso occupa piu' spazio: la vista arretra quanto basta per vederlo tutto
    const r = bboxDiag / 2;
    const k = m.on ? (r + explosionScale * EXPLODE_TARGET / 100) / r : 1;
    zoomA(distanzaInquadra(camera.aspect) * k);
  }
  else if (m.cmd === 'reset') {
    if (_zoomAnim) { cancelAnimationFrame(_zoomAnim); _zoomAnim = null; }
    controls.autoRotate = false;
    camera.position.copy(camStart);
    controls.target.set(0, 0, 0);
    controls.update();
    animateExplode(0);
  }
});

// Rotazione dolce automatica finché l'utente non interagisce (solo vista piena;
// incorporato in una scheda di lavoro il modello sta fermo)
if (!isThumbnail && !isEmbed) {
  controls.autoRotate = true;
  controls.autoRotateSpeed = 0.9;
  controls.addEventListener('start', () => { controls.autoRotate = false; });
}

function animate() {
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene, camera);
}
animate();

// Entrata "montaggio": parte leggermente esploso e si compone (solo vista piena
// e solo se ci sono più corpi). Dà il colpo d'occhio "l'assieme si monta".
if (!isThumbnail && meshList.length > 1) {
  setExplodeUI(EXPLODE_TARGET);
  setTimeout(() => animateExplode(0), 400);
}

window.addEventListener('resize', () => {
  camera.aspect = viewportW() / viewportH();
  camera.updateProjectionMatrix();
  renderer.setSize(viewportW(), viewportH());
  // Incorporato (es. schermo intero o finestra ridimensionata): stessa
  // angolazione, distanza che inquadra di nuovo tutto il modello
  if (isEmbed) {
    const dir = camera.position.clone().sub(controls.target).normalize();
    camera.position.copy(controls.target).add(dir.multiplyScalar(distanzaInquadra(camera.aspect)));
    camStart.copy(camStart.clone().normalize().multiplyScalar(distanzaInquadra(camera.aspect)));
    controls.update();
  }
});
</script>

</body>
