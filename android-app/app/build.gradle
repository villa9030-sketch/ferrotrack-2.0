plugins {
    id 'com.android.application'
}

android {
    namespace 'it.lscarpenteria.ferrotrack'
    compileSdk 34

    defaultConfig {
        applicationId "it.lscarpenteria.ferrotrack"
        minSdk 24
        targetSdk 34
        versionCode 2
        versionName "2.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.webkit:webkit:1.8.0'
}
